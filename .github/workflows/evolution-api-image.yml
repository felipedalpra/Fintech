name: Publish patched Evolution API image

on:
  push:
    branches: [main]
    paths:
      - 'infra/evolution-api/**'
      - '.github/workflows/evolution-api-image.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/evolution-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fintech/evolution-api:latest
            ghcr.io/${{ github.repository_owner }}/fintech/evolution-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
